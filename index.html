<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Essaim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Concept : l'espace défile derrière des panneaux de verre, vu depuis les hublots du vaisseau. Chaque module a sa couleur. */
:root{
  color-scheme:dark;
  --bg:#050d18; --panel:rgba(11,24,40,.84); --solid:#0d1e31; --soft:rgba(255,255,255,.075); --line:rgba(255,255,255,.2);
  --fg:#f0f6fb; --muted:#a9bdcd; --on:#06121e;
  --c:#8fb8ff; --c-soft:rgba(143,184,255,.14);
  --teal:#4fe0b5; --coral:#ff7373; --stamp:#a9bdcd;
  --display:"Unbounded","Trebuchet MS",Arial,sans-serif;
  --body:"Manrope","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
}
:root[data-room=res]{--c:#ff8a5c;--c-soft:rgba(255,138,92,.14)}
:root[data-room=sou]{--c:#52c7f7;--c-soft:rgba(82,199,247,.14)}
:root[data-room=ser]{--c:#58dc90;--c-soft:rgba(88,220,144,.14)}
:root[data-room=qua]{--c:#bb97ff;--c-soft:rgba(187,151,255,.15)}
:root[data-room=pas]{--c:#8fb8ff;--c-soft:rgba(143,184,255,.14)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--body)}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* Barre de mission */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(5,13,24,.6);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud .name{font:700 16px/1 var(--display);letter-spacing:.04em}
.hud .team{color:var(--muted);font-size:14px}
.o2{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
.o2 span{font-weight:700}
.o2 .bar{flex:1;height:8px;background:var(--soft);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.o2 .bar i{display:block;height:100%;background:var(--teal)}
.o2.low .bar i{background:var(--coral)} .o2.low b{color:var(--coral)}
.o2 b{font:700 22px var(--mono);font-variant-numeric:tabular-nums}
.letters{display:flex;gap:4px;align-items:center}
.letters span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font:700 14px var(--display);background:var(--soft)}
.btn-q{background:none;border:1px solid var(--line);border-radius:18px;padding:4px 12px;font-size:14px;color:var(--muted)}
.btn-q:hover{color:var(--fg);border-color:var(--muted)}

/* Plan : ligne de stations */
.ship{display:flex;flex:none;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.comp{flex:1 0 118px;position:relative;background:none;border:0;padding:0 6px;display:flex;align-items:center;gap:8px;text-align:left}
.comp::after{content:"";flex:1;min-width:10px;height:2px;background:var(--line)}
.comp:last-child::after{display:none}
.comp i{position:relative;z-index:1;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--solid);border:2px solid var(--line);font:500 13px var(--display);font-style:normal;color:var(--muted)}
.comp strong{font:700 14px/1.15 var(--body);white-space:nowrap}
.comp.locked{cursor:not-allowed}
.comp.locked strong{color:var(--muted)}
.comp.done i{background:var(--teal);border-color:var(--teal);color:var(--on)}
.comp.done::after{background:var(--teal)}
.comp.open i{border-color:var(--fg);color:var(--fg)}
.comp.here i{background:var(--c);border-color:var(--c);color:var(--on);box-shadow:0 0 16px var(--c)}
.comp.here strong{color:var(--c)}

/* Salle */
.room{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,9fr);gap:14px;padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.archive{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:16px 18px;overflow:auto;min-width:0;border-radius:18px;font-size:15px}
.archive b{color:var(--c)}
.archive .tag{font:500 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--on);background:var(--c);padding:3px 9px;border-radius:10px;display:inline-block}
.archive h3{font-size:18px;line-height:1.25;margin:9px 0 10px;color:var(--fg)}
.archive p{margin-bottom:10px}
.archive ul{margin:0 0 10px;padding-left:19px}
.archive .next{border-top:1px solid var(--line);padding-top:10px}
.console{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px 22px;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:12px}
.console h2{font-size:25px;line-height:1.1;color:var(--c)}
.conhead{display:flex;gap:18px;align-items:center}
.conhead>div:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.hub{flex:none;width:112px;height:112px;border-radius:50%;position:relative;overflow:hidden;background:#020812;border:7px solid #c8d6e0;box-shadow:0 0 0 2px #5f7385,0 0 22px var(--c),inset 0 0 22px #000}
.hub canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hub::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 42%);box-shadow:inset 0 0 18px #000;pointer-events:none}
body.alarm::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,60,60,.5);animation:alarm 1.6s ease-in-out infinite}
@keyframes alarm{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){body.alarm::after{animation:none}}
.noe{color:var(--muted);max-width:80ch}
.noe b{color:var(--fg);margin-right:6px}
.steps{display:flex;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 10px;border-radius:12px;background:var(--soft)}
.steps .ok{color:var(--teal);font-weight:700}
.steps .ok::before{content:"✓ "}
.steps .cur{color:var(--on);background:var(--c);font-weight:700}
.task{display:flex;flex-direction:column;gap:10px}
.task h4{margin:0;font:700 16px/1.35 var(--body)}
.lock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock label{font-size:15px;font-weight:700}
.lock input{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:8px;padding:6px 12px;font:700 18px var(--mono);width:210px}
.lock input:focus{border-color:var(--c)}
.pri{background:var(--c);color:var(--on);border:0;border-radius:22px;padding:9px 20px;font-weight:700}
.pri:hover{filter:brightness(1.12)}
.pri:disabled{opacity:.45;cursor:default}
.sec{background:var(--soft);border:1.5px solid var(--line);border-radius:18px;padding:5px 14px}
.sec:hover{border-color:var(--fg)}
.msg{min-height:1.4em;font-size:15px}
.msg.bad{color:var(--coral);font-weight:700} .msg.good{color:var(--teal);font-weight:700}
.hints{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:auto;padding-top:8px}
.hints p{font-size:15px;background:rgba(255,205,90,.16);color:#ffe3a3;padding:4px 10px;border-radius:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:7px 12px}
.opts button:hover:not(:disabled){border-color:var(--c)}
.opts button:disabled{cursor:default;opacity:.65}

/* Expériences de la Baie réseau */
.exp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.exp svg{width:100%;max-height:300px;display:block;background:rgba(0,0,0,.28);border-radius:14px}
.expside{display:flex;flex-direction:column;gap:10px;min-width:0}
.count{font:700 38px/1 var(--mono);color:var(--c);font-variant-numeric:tabular-nums}
.count small{display:block;font:400 15px/1.3 var(--body);color:var(--muted);margin-top:4px}
.doit{background:var(--c-soft);border-radius:10px;padding:8px 12px;font-weight:700}
.codebox{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.codebox span{width:34px;height:38px;border-radius:7px;display:grid;place-items:center;background:var(--soft);border:2px dashed var(--line);font:700 20px var(--display);color:var(--muted)}
.codebox span.on{background:var(--c);border:2px solid var(--c);color:var(--on)}
.node{cursor:pointer}
.node.static{cursor:default}
.node circle{fill:var(--solid);stroke:var(--c);stroke-width:3}
.node.main circle{fill:var(--c)}
.node.main text{fill:var(--on)}
.node.off circle{fill:#2a3a4a;stroke:var(--muted);stroke-dasharray:4 3}
.node.off text{fill:var(--muted)}
.node.dim{opacity:.35}
.node text{fill:var(--fg);font:700 10.5px var(--body);text-anchor:middle;pointer-events:none}
.node:hover:not(.static) circle{stroke-width:5}
.node:focus-visible circle{stroke:var(--fg);stroke-width:5}
.edge{stroke:var(--line);stroke-width:2}
.edge.on{stroke:var(--c);stroke-width:2.5}
.edge.dead{stroke:var(--coral);stroke-dasharray:4 4;opacity:.55}
.rolelab{font:700 13px var(--body);text-anchor:middle;fill:var(--c);paint-order:stroke;stroke:var(--soft);stroke-width:5px}
.packet{fill:var(--fg);filter:drop-shadow(0 0 5px var(--fg))}

.doctabs{display:flex;gap:5px;flex-wrap:wrap}
.doctabs button.tag{border:0;cursor:pointer}
.doctabs button.tag.off{background:var(--soft);color:var(--muted)}
.noebar{flex:none;display:flex;gap:12px;align-items:center;margin:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding:7px 14px;min-height:60px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--c);border-radius:14px}
.noebar p{font-size:15.5px;line-height:1.35}
.noebar b{color:var(--c)}
.noebar .todo{color:var(--muted);font-size:14px}
.noeface{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on);font:700 16px var(--display);box-shadow:0 0 14px var(--c)}
.conhead .hub{width:72px;height:72px;border-width:5px}
.conhead h2{font-size:22px}
.introtxt{min-width:0}
.intro h1{font-size:clamp(34px,4.6vw,60px)!important}
.bubble{position:relative;margin:14px 0 12px;background:var(--panel);border:1px solid var(--c);border-radius:16px;padding:12px 16px;min-height:150px;font-size:17px;line-height:1.42}
.bubble b{color:var(--c);display:block;font-size:14px}
.bubble::after{content:"";position:absolute;right:-14px;top:50%;border-left:14px solid var(--c);border-top:10px solid transparent;border-bottom:10px solid transparent}
.stage{position:relative;justify-self:center;width:100%;max-width:500px}
.stage .porthole{width:86%;margin-left:14%}
.pilot{position:absolute;left:-4%;bottom:-6%;width:52%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.astro .wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-9deg)}}
.astro.talk .mouth{transform-box:fill-box;transform-origin:center;animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(3.1)}}
.pilot{animation:bob 7s ease-in-out infinite}
.sasbottom{display:grid;gap:8px;justify-items:center}
.sasnote{background:rgba(5,13,24,.9);border:1px solid var(--line);border-radius:12px;padding:4px 14px;font-size:14px;text-align:center}
.formlink{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){.astro .wave,.astro.talk .mouth,.pilot{animation:none}}

.fun{cursor:pointer}.fun:hover{filter:brightness(1.25)}.fun:focus{outline:none}.fun:focus-visible{filter:brightness(1.4) drop-shadow(0 0 5px #fff)}
.evo{opacity:0;animation:evo 12s linear infinite}
.evo.e1{animation-name:evo1}.evo.e2{animation-name:evo2}.evo.e3{animation-name:evo3}
@keyframes evo1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes evo2{0%,28%{opacity:0}33%,61%{opacity:1}66%,100%{opacity:0}}
@keyframes evo3{0%,61%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
.wig{transform-box:fill-box;transform-origin:50% 0;animation:wig 1.1s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.walker{animation:walk 26s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateX(340px)}to{transform:translateX(930px)}}
.bub{animation:bub 3.4s linear infinite}
@keyframes bub{from{transform:translateY(40px);opacity:0}30%{opacity:.8}to{transform:translateY(-110px);opacity:0}}
.pop{animation:pop 5s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:translateY(16px)}78%{transform:translateY(-26px)}86%{transform:translateY(16px)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 16s ease-out both}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
.leafin{transform-box:fill-box;transform-origin:center;animation:leafin 2.2s ease-out both}
@keyframes leafin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.evo.e3{opacity:1;animation:none}.evo.e1,.evo.e2{animation:none}.wig,.walker,.bub,.pop,.grow,.leafin{animation:none}}

.credit{font-size:12px;color:var(--muted);margin-top:6px}

/* Scènes */
.scene{grid-column:1/-1;min-height:0;display:flex;flex-direction:column}
.scene svg.set{flex:1;min-height:0;width:100%;border-radius:18px;border:1px solid var(--line);background:#0b1826}
.scene .hub{width:100%;height:100%;border-width:9px;box-shadow:inset 0 0 22px #000}
.bay canvas{width:100%;height:100%;display:block;background:#020812}
.bay{width:100%;height:100%;border-radius:14px;overflow:hidden}
.hs{cursor:pointer}
.hs .glow{fill:transparent;stroke:var(--c);stroke-width:2;stroke-dasharray:7 6;opacity:.75}
.hs:hover .glow,.hs:focus-visible .glow{fill:var(--c-soft);opacity:1;stroke-width:3}
.hs:focus{outline:none}
.hs .pill{fill:var(--c)}
.hs .pilltxt{fill:var(--on);font:700 15px var(--body);text-anchor:middle}
.hs.seen .pill{fill:var(--teal)}
.hs.lockd{opacity:.72}
.hs .ping{fill:none;stroke:var(--c);stroke-width:3;animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}
.lbl{font:700 13px var(--mono);fill:#d7e4ee;text-anchor:middle}
.led{animation:led 1.3s steps(2) infinite}
@keyframes led{50%{opacity:.2}}
.beam{animation:beam 2.6s ease-in-out infinite alternate}
@keyframes beam{to{transform:translateX(300px)}}
.overlay .archive{max-width:640px;width:100%;max-height:88%;background:var(--solid);display:grid;gap:4px;font-size:16px}
.overlay .archive .pri{justify-self:start;margin-top:8px}
body.shake #app{animation:shake .4s linear}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
@media (prefers-reduced-motion:reduce){.hs .ping,.led,.beam{animation:none}body.shake #app{animation:none}}

/* Morceaux */
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.slot{height:48px;display:grid;place-items:center;border-radius:8px;background:var(--soft);border:2px dashed var(--line);font:700 20px var(--mono);color:var(--muted)}
.slot.ok{border:2px solid var(--c);background:var(--c);color:var(--on)}
.peers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.peer{border-radius:10px;padding:8px 10px;background:var(--soft)}
.peer.off{background:rgba(255,115,115,.14)}
.peer b{font-family:var(--display)}
.peer small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.peer.off small{color:var(--coral);font-weight:700}
.peer .ps{display:flex;gap:4px;flex-wrap:wrap}
.peer button{padding:2px 8px;font-size:14px;background:rgba(0,0,0,.3);border:1.5px solid var(--c);border-radius:6px}
.peer button:hover:not(:disabled){background:var(--c);color:var(--on)}
.peer button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.order{display:grid;gap:6px}
.order button{text-align:left;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:8px 12px;display:flex;gap:10px}
.order button:hover:not(:disabled){border-color:var(--c)}
.order button i{font:700 16px var(--display);font-style:normal;width:20px;color:var(--c);flex:none}
.order button:disabled{cursor:default;background:var(--c-soft)}

/* Débit */
.rate{display:grid;gap:7px;font-size:15px}
.rate .row{display:grid;grid-template-columns:140px 1fr 90px;gap:8px;align-items:center}
.rate .track{height:18px;background:var(--soft);border-radius:9px;overflow:hidden}
.rate .track i{display:block;height:100%}
input[type=range]{width:100%;accent-color:var(--c)}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.box{background:var(--soft);border-radius:12px;padding:8px 12px;display:grid;gap:6px}
.box h5{margin:0;font:700 15px var(--body);color:var(--c)}
.box .nok{color:var(--coral)}
.seats{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.seats i,.seatkey i{display:block;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12)}
.seats i.on,.seatkey i.on{background:var(--teal)}
.seats i.no,.seatkey i.no{background:var(--coral)}
.seatkey{font-size:14px;color:var(--muted);gap:16px}
.seatkey span{display:flex;align-items:center;gap:6px}
.seatkey i{width:12px;height:12px}
.lex{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px}
.lex b{color:var(--c)}

.zone{background:var(--c-soft);border:1px dashed var(--c);border-radius:12px;padding:10px 14px;min-height:62px;font-size:16px}
.zone em{color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px}
.blk{text-align:left;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:7px 12px;font-size:15px}
.blk:hover{border-color:var(--c)}
.blk.in{background:var(--c);color:var(--on);font-weight:700}
.report{display:grid;gap:5px;font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px}
.todo{color:var(--muted)}

/* Cartes */
.cards{display:grid;gap:5px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:5px 10px;font-size:15px}
.card.wrong{border-color:var(--coral)}
.card.right{border-color:var(--teal)}
.seg{display:flex}
.seg button{background:rgba(0,0,0,.28);border:1.5px solid var(--line);padding:2px 10px;font-size:14px;white-space:nowrap}
.seg button:first-child{border-radius:14px 0 0 14px}
.seg button:last-child{border-radius:0 14px 14px 0;border-left:0}
.seg button[aria-pressed=true]{background:var(--c);color:var(--on);border-color:var(--c);font-weight:700}
.cipher{font:700 25px var(--mono);letter-spacing:.08em;color:var(--c);background:var(--c-soft);padding:8px 14px;border-radius:10px;overflow-wrap:anywhere}
.dial{display:flex;gap:8px;align-items:center}

/* Rapport */
.q{background:var(--soft);border:2px solid transparent;border-radius:10px;padding:10px 12px;display:grid;gap:7px}
.q.ok{border-color:var(--teal)}
.q textarea{width:100%;min-height:68px;background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.q .model{font-size:15px;color:var(--teal)}

/* Plein écran */
.screen{flex:1;min-height:0;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;place-items:center}
.intro{width:100%;max-width:1120px;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:40px;align-items:center}
.intro h1{font-size:clamp(38px,5.6vw,74px);line-height:1.02;font-weight:700}
.intro .lead{font-size:19px;margin:14px 0 8px;max-width:56ch}
.intro .rules{margin:12px 0 0;padding-left:20px;color:var(--muted)}
.intro .start{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.intro input{background:rgba(0,0,0,.35);border:2px solid var(--line);border-radius:22px;padding:9px 16px;flex:1;min-width:180px}
.porthole{position:relative;width:100%;max-width:480px;aspect-ratio:1;justify-self:center;border-radius:50%;background:#020812;border:18px solid #c8d6e0;box-shadow:0 0 0 3px #5f7385,0 0 60px rgba(143,184,255,.45),inset 0 0 50px #000;overflow:hidden}
.porthole canvas,.porthole svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.porthole::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.17),transparent 40%);pointer-events:none}
.porthole .craft{animation:bob 6s ease-in-out infinite;transform-origin:center}
.porthole .flame{animation:flick .25s linear infinite alternate;transform-origin:62px 190px}
@keyframes bob{50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes flick{to{transform:scaleX(1.5)}}
@media (prefers-reduced-motion:reduce){.porthole .craft,.porthole .flame{animation:none}}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(16,38,58,.6);padding:16px;overflow:auto}
.sas{position:fixed;inset:0;z-index:30;overflow:hidden;--stripe:repeating-linear-gradient(45deg,#f2b632 0 18px,#14202c 18px 36px)}
.sas[data-state=open]{pointer-events:none}
.leaf{position:absolute;top:0;bottom:0;width:50.2%;overflow:hidden;
  background:
   radial-gradient(circle,#6d8499 2.6px,transparent 3.4px) 0 0/76px 76px,
   repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 152px),
   linear-gradient(180deg,#32475b,#233548 55%,#1a2a3a);
  transition:transform 1.45s cubic-bezier(.65,0,.2,1)}
.leaf::before,.leaf::after{content:"";position:absolute;left:0;right:0;height:34px;background:var(--stripe)}
.leaf::before{top:0}.leaf::after{bottom:0}
.leaf.l{left:0;box-shadow:inset -3px 0 0 #0a131c}
.leaf.r{right:0;box-shadow:inset 3px 0 0 #0a131c}
.sten{position:absolute;top:50%;transform:translateY(-50%);font:700 clamp(56px,10vw,150px)/1 var(--display);color:rgba(240,246,251,.13);letter-spacing:.02em}
.leaf.l .sten{left:5%}.leaf.r .sten{right:5%}
.ring{position:absolute;top:50%;width:min(58vh,420px);height:min(58vh,420px);margin-top:calc(min(58vh,420px)/-2);border-radius:50%;background:radial-gradient(circle,#14222f 0 52%,#0d1824 52% 56%,#3e5468 56% 66%,#0d1824 66% 68%,transparent 68%)}
.leaf.l .ring{right:calc(min(58vh,420px)/-2)}.leaf.r .ring{left:calc(min(58vh,420px)/-2)}
.bolts i{position:absolute;left:calc(50% - 150px);width:300px;height:22px;background:linear-gradient(180deg,#d5e0e8,#7e93a5);border-radius:5px;box-shadow:0 3px 6px rgba(0,0,0,.5);transform-origin:center;transition:transform .55s ease-in .1s}
.bolts .b0{top:16%}.bolts .b3{bottom:16%}
.sas:not([data-state=closed]) .bolts i{transform:scaleX(0)}
.wheel{position:absolute;left:50%;top:50%;width:min(30vh,220px);height:min(30vh,220px);margin:calc(min(30vh,220px)/-2) 0 0 calc(min(30vh,220px)/-2);filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));transition:opacity .2s ease}
.sas[data-state=unlock] .wheel{animation:spin .8s cubic-bezier(.5,0,.3,1) forwards}
.sas[data-state=open] .wheel{opacity:0;transform:rotate(300deg)}
@keyframes spin{to{transform:rotate(300deg)}}
.beacon{position:absolute;top:50px;width:30px;height:30px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 28px 9px rgba(255,75,75,.75);animation:beat 1s steps(2) infinite}
.beacon.a{left:7%}.beacon.z{right:7%}
@keyframes beat{50%{opacity:.35}}
.sas:not([data-state=closed]) .beacon{background:#4fe0b5;box-shadow:0 0 34px 12px rgba(79,224,181,.8);animation:none}
.sasinfo{position:absolute;inset:48px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:opacity .25s;pointer-events:none}
.sasinfo button{pointer-events:auto}
.sas:not([data-state=closed]) .sasinfo{opacity:0}
.sas:not([data-state=closed]) .sasgo{pointer-events:none}
.sasletter{display:flex;align-items:center;gap:14px;background:rgba(5,13,24,.9);border:1px solid var(--line);border-radius:16px;padding:8px 18px;font-weight:700;line-height:1.25}
.sasletter b{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on);font:700 32px var(--display);box-shadow:0 0 28px var(--c)}
.sasgo{font-size:18px;padding:13px 28px;box-shadow:0 0 30px var(--c)}
.sas[data-state=open] .leaf.l{transform:translateX(-101%)}
.sas[data-state=open] .leaf.r{transform:translateX(101%)}
.sasglow{position:absolute;inset:0;background:radial-gradient(ellipse 34% 90% at center,#fff,var(--c) 45%,transparent 75%);opacity:0}
.sas[data-state=open] .sasglow{animation:flash 1.5s ease-out forwards}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.steam i{position:absolute;left:50%;top:calc(8% + var(--k)*12%);width:130px;height:130px;margin-left:-65px;border-radius:50%;background:radial-gradient(circle,rgba(235,244,250,.75),transparent 70%);opacity:0}
.sas[data-state=open] .steam i{animation:puff 1.3s ease-out forwards;animation-delay:calc(var(--k)*25ms)}
.sas[data-state=open] .steam i:nth-child(odd){--dir:-1}
.sas[data-state=open] .steam i:nth-child(even){--dir:1}
@keyframes puff{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:translateX(calc(var(--dir)*190px)) scale(2.5)}}
@media (prefers-reduced-motion:reduce){.beacon{animation:none}}
.modal{background:var(--solid);border-radius:14px;padding:18px 22px;max-width:780px;width:100%;max-height:90%;overflow:auto;display:grid;gap:10px}
.modal h2{font-size:26px}
.modal table{border-collapse:collapse;width:100%;font-size:15px}
.modal td,.modal th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.modal a{color:var(--c)}
.modal input{background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:8px;padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{max-width:880px;width:100%;display:grid;gap:13px}
.end h1{font-size:clamp(36px,5.6vw,66px);line-height:1.05;font-weight:700}
.end textarea{width:100%;height:210px;background:rgba(0,0,0,.4);border:1.5px solid var(--line);border-radius:10px;padding:10px;font:400 14px var(--mono)}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats b{display:block;font:700 32px var(--mono);color:var(--teal)}
@media (max-width:820px){
  html,body{height:auto}
  #app{height:auto;min-height:100%}
  .room,.intro,.exp{grid-template-columns:minmax(0,1fr)}
  .hub{width:76px;height:76px;border-width:5px}
  #space{position:fixed}
  .rate .row{grid-template-columns:90px 1fr 70px}
  .card{grid-template-columns:minmax(0,1fr)}
}
</style>

<body>
<canvas id="space" aria-hidden="true"></canvas>
<div id="app"></div>

<script>
const FORM_URL=''; /* Coller ici l'adresse du Google Form pour afficher le bouton d'envoi */
const TOTAL=1800, TEACHER="SNT2026";
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[̀-ͯ]/g,'');

const ROOMS=[
 {id:'res',name:'Baie réseau',letter:'R'},
 {id:'sou',name:'Soute à données',letter:'I'},
 {id:'ser',name:'Serre',letter:'P'},
 {id:'qua',name:'Quarantaine',letter:'A'},
 {id:'pas',name:'Passerelle',letter:''}
];
const fresh=()=>({screen:'intro',team:'',elapsed:0,hints:0,errors:0,room:0,done:[false,false,false,false,false],step:[0,0,0,0,0],shown:{},pieces:[],gammaOff:false,picks:{},sorted:{},cargo:{},scene:{},read:{},typed:{},mute:false,leak:false,answers:{},valid:{},paused:false});
let S=fresh();
try{const raw=localStorage.getItem('essaim8');if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem('essaim8',JSON.stringify(S));}catch(e){}};
const fmt=t=>{const a=Math.abs(t);return (t<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');};

setInterval(()=>{if(S.screen==='room'&&!S.paused&&document.visibilityState==='visible'){S.elapsed++;if(S.elapsed%5===0)save();hud();if(TOTAL-S.elapsed<300&&S.elapsed%4===0)sfx('beep');}},1000);
function hud(){
  const el=$('#o2');if(!el)return;
  const rem=TOTAL-S.elapsed;
  el.classList.toggle('low',rem<300);
  document.body.classList.toggle('alarm',rem<300&&S.screen==='room');
  $('#o2t').textContent=rem>=0?fmt(rem):'réserve '+fmt(-rem);
  $('#o2b').style.width=Math.max(0,rem/TOTAL*100)+'%';
  $('#hc').textContent=S.hints;
  $$('.letters span').forEach((sp,i)=>{sp.textContent=S.done[i]?ROOMS[i].letter:'·';});
}
function penalty(sec){S.elapsed+=sec;S.errors++;save();hud();sfx('err');shake();}

/* ----- Espace qui défile ----- */
const SP={views:[],warp:0,warpUntil:0,last:0};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function addView(cv,o){
  const stars=[];for(let i=0;i<o.n;i++)stars.push({x:Math.random(),y:Math.random(),z:.2+Math.random()*.8});
  const v={cv,ctx:cv.getContext('2d'),stars,o,planet:null,next:o.first||6};SP.views.push(v);return v;
}
function warp(ms){SP.warpUntil=performance.now()+ms;}
function roomColor(){return getComputedStyle(document.documentElement).getPropertyValue('--c').trim()||'#8fb8ff';}
function frame(t){
  const dt=Math.min(.05,(t-SP.last)/1000||0);SP.last=t;
  const target=t<SP.warpUntil?1:0;SP.warp+=(target-SP.warp)*Math.min(1,dt*4);
  SP.views=SP.views.filter(v=>v.cv.isConnected);
  for(const v of SP.views){
    const {cv,ctx,o}=v,dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)continue;
    if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=o.bg;ctx.fillRect(0,0,w,h);
    if(o.nebula){for(const [x,y,r,col] of [[.2,.25,.55,'rgba(70,90,190,.16)'],[.8,.75,.6,'rgba(150,60,150,.11)']]){
      const g=ctx.createRadialGradient(x*w,y*h,0,x*w,y*h,r*w);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}}
    const sp=RM?0:o.speed*(1+SP.warp*45);
    ctx.fillStyle='#fff';
    for(const s of v.stars){
      s.x-=s.z*sp*dt;if(s.x<-.3){s.x=1.02;s.y=Math.random();}
      const len=Math.max(s.z*o.size,s.z*sp*.035*w);
      ctx.globalAlpha=.3+s.z*.7;ctx.fillRect(s.x*w,s.y*h,len,Math.max(.8,s.z*o.size));
    }
    ctx.globalAlpha=1;
    if(o.planets&&!RM){
      v.next-=dt;
      if(!v.planet&&v.next<=0)v.planet={x:1.5,y:.2+Math.random()*.6,r:.2+Math.random()*.22,col:o.first?'#2f86c2':roomColor()};
      const p=v.planet;
      if(p){p.x-=(o.speed*.45*(1+SP.warp*20))*dt;
        const px=p.x*w,py=p.y*h,pr=p.r*w,g=ctx.createRadialGradient(px-pr*.4,py-pr*.4,pr*.1,px,py,pr);
        g.addColorStop(0,p.col);g.addColorStop(1,'#04101c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,pr,0,7);ctx.fill();
        if(p.x<-.6){v.planet=null;v.next=5+Math.random()*7;}}
    }
  }
  requestAnimationFrame(frame);
}
addView($('#space'),{n:230,speed:.012,size:1.7,bg:'#050d18',nebula:true});
const hubEl=document.createElement('div');hubEl.className='hub';hubEl.setAttribute('aria-hidden','true');hubEl.innerHTML='<canvas></canvas>';
const hubCv=hubEl.firstChild;
const hubView={n:46,speed:.09,size:1.6,bg:'#020812',planets:true};
requestAnimationFrame(frame);

/* ----- Son, tout est synthétisé ----- */
const AU={ctx:null,master:null};
function audioStart(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C();AU.ctx=c;AU.master=c.createGain();AU.master.gain.value=S.mute?0:.8;AU.master.connect(c.destination);
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=170;const g=c.createGain();g.gain.value=.055;f.connect(g);g.connect(AU.master);
    [48,48.6,72].forEach(h=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=h;o.connect(f);o.start();});
    const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.13;lg.gain.value=55;l.connect(lg);lg.connect(f.frequency);l.start();
  }catch(e){AU.ctx=null;}
}
function tone(f,t0,d,type,v,f2){const c=AU.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);
  g.gain.setValueAtTime(v,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.0008,c.currentTime+t0+d);o.connect(g);g.connect(AU.master);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.02);}
function sfx(n){if(!AU.ctx||S.mute)return;
  if(n==='ok'){tone(660,0,.14,'sine',.13);tone(880,.11,.22,'sine',.13);}
  if(n==='err'){tone(150,0,.28,'square',.08,90);}
  if(n==='alarm'){[0,.3,.6].forEach(t=>tone(760,t,.2,'square',.05,520));}
  if(n==='door'){tone(90,0,1,'sawtooth',.13,340);tone(1040,.9,.3,'sine',.09);}
  if(n==='warp'){tone(60,0,3,'sawtooth',.15,1500);}
  if(n==='clunk'){tone(120,0,.12,'square',.14,60);tone(95,.3,.12,'square',.14,50);tone(180,.62,.1,'square',.12,70);}
  if(n==='hiss'&&AU.ctx){const c=AU.ctx,b=c.createBuffer(1,c.sampleRate*1.3,c.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*(1-k/d.length);const n2=c.createBufferSource();n2.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2400;const g=c.createGain();g.gain.value=.09;n2.connect(f);f.connect(g);g.connect(AU.master);n2.start();}
  if(n==='tick'){tone(1500,0,.02,'square',.012);}
  if(n==='beep'){tone(700,0,.14,'square',.035);}
}
function setMute(m){S.mute=m;save();if(AU.master)AU.master.gain.value=m?0:.8;const b=$('#snd');if(b)b.textContent=m?'Son : coupé':'Son : activé';}
addEventListener('pointerdown',()=>{if(S.screen!=='intro')audioStart();});
function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),450);}
let typeT=null;
function typeSynced(el,text,ms){clearInterval(typeT);if(RM){el.textContent=text;return;}const t0=performance.now();el.textContent='';
  typeT=setInterval(()=>{if(!el.isConnected){clearInterval(typeT);return;}const n=Math.ceil(text.length*Math.min(1,(performance.now()-t0)/ms));el.textContent=text.slice(0,n);if(n>=text.length)clearInterval(typeT);},50);}
function typeInto(el,text,key){
  clearInterval(typeT);
  if(RM||S.typed[key]){el.textContent=text;return;}
  S.typed[key]=true;save();let i=0;
  typeT=setInterval(()=>{if(!el.isConnected){clearInterval(typeT);return;}i+=2;el.textContent=text.slice(0,i);if(i%6===0)sfx('tick');if(i>=text.length){el.textContent=text;clearInterval(typeT);}},30);
}

/* ----- Archives ----- */
const DOCS={
 d1:{tab:'Doc 1',html:`<h3>Les machines client et serveur</h3>
  <p><b>Client :</b> l'ordinateur qui envoie une demande (une <b>requête</b>).<br><b>Serveur :</b> l'ordinateur qui y répond.</p>
  <p><b>Réseau 1, pair-à-pair (P2P) :</b> chaque machine envoie des requêtes et y répond. Elle est donc <b>à la fois client et serveur</b>. Pour cela, elle a un logiciel qui suit les mêmes règles d'échange que les autres : le même <b>protocole</b>.</p>
  <p><b>Réseau 2, non pair-à-pair :</b> seule la <b>machine centrale</b> répond aux requêtes des machines clientes autour d'elle.</p>
  <p class="next">Sur Essaim-4, le Cerveau central est la machine centrale du réseau 2. Les modules sont aussi reliés en réseau 1 : ils peuvent ainsi continuer à se coordonner sans lui.</p>`},
 d2:{tab:'Doc 2',html:`<h3>Le protocole BitTorrent</h3>
  <p>C'est l'un des protocoles les plus connus pour échanger des fichiers en pair-à-pair.</p>
  <p><b>Par courriel :</b> une image est découpée en petits morceaux, les <b>paquets</b>. Ils viennent d'une <b>source unique</b> : l'ordinateur qui envoie.</p>
  <p><b>Par BitTorrent :</b> les paquets viennent de <b>plusieurs sources</b> : tous les ordinateurs qui ont l'image, en entier ou en partie.</p>
  <ul><li>Le téléchargement est beaucoup plus rapide.</li><li>Si la liaison vers un ordinateur s'interrompt, un autre prend la suite.</li></ul>
  <p>Le logiciel affiche le fichier téléchargé et l'<b>adresse IP</b> (l'adresse sur Internet) des ordinateurs qui envoient les morceaux.</p>`},
 d3:{tab:'Doc 3',html:`<h3>Les usages légaux du pair-à-pair</h3>
  <p>L'usage légal le plus connu est le <b>téléchargement de fichiers par des particuliers</b>.</p>
  <p>Des <b>entreprises</b> s'en servent aussi pour envoyer les mises à jour de leurs logiciels.</p>
  <p>D'autres usages existent, comme les <b>réseaux sociaux pair-à-pair</b> tels que Matrix.</p>
  <p class="next">Sur un réseau social classique, toutes les informations sont stockées sur les serveurs d'une entreprise privée, qui peut les exploiter. Sur Matrix, elles sont réparties sur les ordinateurs des utilisateurs.</p>`},
 d3b:{tab:'Doc 3 bis',html:`<h3>Protéger les données et diffuser en direct</h3>
  <p><b>Protéger les données :</b> quand tout est au même endroit, il suffit d'atteindre un seul serveur pour accéder aux informations de tous. Si elles sont réparties sur les ordinateurs des utilisateurs, partout sur la planète, personne ne peut toutes les récupérer d'un coup.</p>
  <p><b>Diffuser une vidéo en direct :</b> plus il y a d'utilisateurs, plus il y a de relais pour diffuser les images. Les moyens de diffusion s'adaptent donc à la demande.</p>
  <p class="next">Exemple d'un match : au lieu d'un serveur qui travaille beaucoup, tous les ordinateurs travaillent un peu.</p>`},
 d4:{tab:'Doc 4',html:`<h3>Les usages illégaux du pair-à-pair</h3>
  <p><b>Usage illégal principal :</b> télécharger gratuitement des <b>œuvres</b> normalement payantes : films, musique, jeux vidéo.</p>
  <p><b>En France :</b> l'<b>Arcom</b> (Autorité de régulation de la communication audiovisuelle et numérique) est l'organisme public qui contrôle la télévision, la radio et les contenus en ligne. Elle protège notamment les droits de ceux qui créent ces œuvres.</p>
  <p><b>Trois modes de piratage de vidéos :</b> le pair-à-pair, le téléchargement direct et le <b>streaming</b> (regarder en ligne sans garder le fichier), désormais le plus utilisé.</p>`},
 n26:{tab:'Info 2026',html:`<h3>Où en est la loi en 2026 ?</h3>
  <p>Depuis avril 2026, l'Arcom n'envoie plus ses avertissements aux internautes.</p>
  <p>Mais copier et partager des œuvres sans autorisation (la <b>contrefaçon</b>) reste interdit. La peine peut aller jusqu'à <b>3 ans de prison et 300 000 € d'amende</b>.</p>`}
};
const ROOMDOCS={res:['d1'],sou:['d2'],ser:['d3','d3b'],qua:['d4','n26'],pas:['d1','d2','d3','d3b','d4','n26']};
const docTab={};
function fillDocs(el,id,extra=''){
  const ids=ROOMDOCS[id],k=Math.min(docTab[id]||0,ids.length-1);
  el.innerHTML=`<div class="doctabs" role="tablist">${ids.map((d,i)=>`<button role="tab" aria-selected="${i===k}" class="tag ${i===k?'':'off'}" data-t="${i}">${DOCS[d].tab}</button>`).join('')}</div>${DOCS[ids[k]].html}${extra}`;

function starSVG(){const {c,o}=NETPTS,cut=BAY.cut1;
  const e=o.map(p=>`<line class="edge ${cut?'dead':'on'}" x1="${c[0]}" y1="${c[1]}" x2="${p[0]}" y2="${p[1]}"/>`).join('');

function meshSVG(mode){const {o}=NETPTS;let e='';
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){

  const n=o.map((p,i)=>{const off=mode==='cut'&&BAY.cut2===i;const dim=mode==='flow'&&i!==0&&i!==3;const stat=mode==='flow';
    return `<g class="node ${off?'off':''} ${dim?'dim':''} ${stat?'static':''}" data-i="${i}" ${stat?'':`tabindex="0" role="button" aria-label="Couper le module ${MODS[i]}"`}><circle cx="${p[0]}" cy="${p[1]}" r="24"/><text x="${p[0]}" y="${p[1]+4}">${MODS[i]}</text></g>`;}).join('');
  return `<svg viewBox="0 0 300 240" role="img" aria-label="Réseau pair-à-pair : six modules reliés entre eux">${e}${n}<g id="flowlayer"></g></svg>`;}

function s_report(host){
  const idx=QS.findIndex(q=>!S.valid[q.id]);
  const d=document.createElement('div');d.className='task';host.append(d);
  if(idx<0){
    d.innerHTML=`<h4>Rapport accepté. Dernier verrou : remettez dans l'ordre les 4 lettres récupérées dans les sas. Elles forment le nom donné à chaque machine de ce réseau.</h4><div class="report">${QS.map(q=>`<p>${esc(S.answers[q.id])}</p>`).join('')}</div>`;
    lock(host,{label:'Mot de relance',answer:'PAIR',ok:()=>{S.done[4]=true;S.screen='end';save();warp(3500);sfx('warp');document.body.classList.remove('alarm');render();}});
    return;
  }
  const q=QS[idx];
  const pick=S.picks[q.id]||(S.picks[q.id]=q.opinion?{p:null,a:[]}:[]);
  const prog=`<div class="steps">${QS.map((x,i)=>`<span class="${S.valid[x.id]?'ok':i===idx?'cur':''}">Question ${i+1}</span>`).join('')}</div>`;
  if(q.opinion){
    d.innerHTML=`${prog}<h4>${q.t}</h4><div class="zone">${pick.p===null?'<em>Votre phrase apparaîtra ici.</em>':esc(opinionText(q,pick))}</div>
    <div class="blocks">${q.pos.map((t,i)=>`<button class="blk ${pick.p===i?'in':''}" data-p="${i}" aria-pressed="${pick.p===i}">${t}</button>`).join('')}</div>
    <p class="todo"><b>parce que…</b></p>
    <div class="blocks">${q.args.map((t,i)=>`<button class="blk ${pick.a.includes(i)?'in':''}" data-a="${i}" aria-pressed="${pick.a.includes(i)}">${t}</button>`).join('')}</div>
    <div class="row"><button class="pri" id="send">Transmettre à la commandante</button><span class="msg bad" id="qm" role="status"></span></div>`;
    $$('[data-p]',d).forEach(b=>b.onclick=()=>{pick.p=+b.dataset.p;save();sfx('tick');renderRoom();});
    $$('[data-a]',d).forEach(b=>b.onclick=()=>{const i=+b.dataset.a,k=pick.a.indexOf(i);k<0?pick.a.push(i):pick.a.splice(k,1);save();sfx('tick');renderRoom();});
    $('#send',d).onclick=()=>{
      if(pick.p===null||!pick.a.length){$('#qm',d).textContent='Choisissez une position et au moins un argument.';return;}
      S.answers[q.id]=opinionText(q,pick);S.valid[q.id]=true;save();sfx('ok');renderRoom();};
    return;
  }
  d.innerHTML=`${prog}<h4>${q.t}</h4><div class="zone">${pick.length?pick.map(i=>esc(q.b[i][0])).join(' '):'<em>Cliquez sur les bonnes phrases : elles s\'ajouteront ici.</em>'}</div>
  <div class="blocks">${q.b.map((b,i)=>`<button class="blk ${pick.includes(i)?'in':''}" data-k="${i}" aria-pressed="${pick.includes(i)}">${b[0]}</button>`).join('')}</div>
  <div class="row"><button class="pri" id="send">Transmettre à la commandante</button><span class="msg bad" id="qm" role="status"></span></div>`;
  $$('[data-k]',d).forEach(b=>b.onclick=()=>{const i=+b.dataset.k,k=pick.indexOf(i);k<0?pick.push(i):pick.splice(k,1);save();sfx('tick');renderRoom();});
  $('#send',d).onclick=()=>{
    if(!pick.length){$('#qm',d).textContent='Choisissez au moins une phrase.';return;}
    const need=q.b.filter(b=>b[1]).length,right=pick.filter(i=>q.b[i][1]).length,wrong=pick.length-right;
    if(right===need&&!wrong){
      S.answers[q.id]=pick.slice().sort((a,b)=>q.b[a][1]-q.b[b][1]).map(i=>q.b[i][0]).join(' ');
      S.valid[q.id]=true;save();sfx('ok');renderRoom();return;}
    penalty(15);
    $('#qm',d).textContent=(wrong?'Au moins une phrase est fausse.':'Il manque au moins une phrase.')+' Relisez '+q.doc+'. 15 secondes perdues.';
  };
}
function opinionText(q,p){let t=q.pos[p.p];if(p.a.length){const a=p.a.slice().sort((x,y)=>x-y).map(i=>q.args[i]);t+=' parce que '+a.join(' et que ')+'.';}else t+='…';return t.replace(/que il/g,"qu'il");}

function renderRoom(){
  document.documentElement.dataset.room=ROOMS[S.room].id;
  renderShip();
  if(!S.done[S.room]&&!S.scene[ROOMS[S.room].id]){
    if(ROOMS[S.room].id==='ser'&&!S.leak){S.leak=true;S.elapsed+=60;save();sfx('alarm');shake();}
    return renderScene(ROOMS[S.room]);
  }
  const r=ROOMS[S.room],st=STEPS[r.id],cur=Math.min(S.step[S.room],st.length-1),room=$('#room');
  room.innerHTML=`<article class="archive" tabindex="0" id="docs"></article><section class="console" id="con"></section>`;
  fillDocs($('#docs'),r.id);
  const c=$('#con');
  c.innerHTML=`<div class="conhead"><div><h2>${r.name}</h2>${st.length>1?`<div class="steps">${st.map((s,i)=>`<span class="${S.done[S.room]||i<cur?'ok':i===cur?'cur':''}">${s.t}</span>`).join('')}</div>`:''}</div></div>`;
  $('.conhead',c).append(hubEl);
  const line=S.done[S.room]&&r.id!=='pas'?'Module rétabli. Continuons.':(LINES[r.id][cur]||INTROS[r.id]);
  $('#todo').textContent='';typeInto($('#noet'),line,'l'+r.id+cur);
  if(!SP.views.some(v=>v.cv===hubCv))addView(hubCv,hubView);
  if(S.done[S.room]&&r.id!=='pas'){
    const m=document.createElement('p');m.className='msg good';m.textContent='Module rétabli. Vous pouvez relire le document, ou passer au module suivant sur le plan.';c.append(m);
    const n=document.createElement('button');n.className='pri';n.textContent='Aller vers : '+ROOMS[S.room+1].name;n.style.alignSelf='flex-start';n.onclick=()=>{S.room++;save();renderRoom();};c.append(n);
    return;
  }
  const step=st[cur];step.f(c);
  const hk=r.id+cur;const shown=S.shown[hk]||0;
  const h=document.createElement('div');h.className='hints';
  h.innerHTML=step.h.slice(0,shown).map(t=>`<p>Indice : ${t}</p>`).join('')+(shown<step.h.length?`<button class="sec" id="hint">Demander un indice à NOÉ (−1 min d'oxygène)</button>`:'');
  c.append(h);
  if($('#hint',h))$('#hint',h).onclick=()=>{S.shown[hk]=shown+1;S.hints++;S.elapsed+=60;save();hud();renderRoom();};
  hud();
}

    <div class="sasbottom"><p class="sasnote">Protection anti-intrusion : ce sas ne s'ouvre qu'après un raisonnement humain.</p><button class="pri sasgo" id="enter">Ouvrir le sas : ${nxt.name}</button></div></div>`;
  document.body.append(w);

  const going=S.elapsed>0;let k=going?SPEECH.length-1:0;
  app.innerHTML=`<div class="screen"><div class="intro"><div class="introtxt">
    <h1>Mission Essaim</h1>
    <div class="bubble" role="status"><b>Commandante Vega-7</b><p id="say"></p></div>
    <div class="row" id="ctrl"><button class="pri" id="next">Suite</button><button class="sec" id="voice" aria-pressed="false">Écouter sa voix</button><button class="btn-q" id="skip">Passer le message</button><span class="todo" id="pg"></span></div>
    <p class="credit">Voix de synthèse : ElevenLabs (elevenlabs.io)</p>
    <div id="go" hidden><ul class="rules"><li>Explorez chaque salle et lisez ses documents, puis résolvez ses énigmes.</li><li>Une erreur coûte 15 secondes, un indice coûte 1 minute.</li><li>À la Passerelle, répondez aux questions de la commandante.</li></ul>
    <form class="start" id="f"><input id="team" aria-label="Noms de l'équipage" placeholder="Noms de l'équipage" value="${esc(S.team)}"><button class="pri">${going?'Reprendre la mission':'Embarquer'}</button></form>
    <div class="row" style="margin-top:10px">${going?'<button class="btn-q" id="rs">Recommencer à zéro</button>':''}</div></div>
   </div><div class="stage" aria-hidden="true"><div class="porthole"><canvas id="bigport"></canvas><svg viewBox="0 0 400 400"><g class="craft">
     <g transform="rotate(-14 200 170)"><rect x="56" y="150" width="62" height="40" fill="#1d4f7a" stroke="#8fc3e8"/><path d="M76 150v40M97 150v40" stroke="#8fc3e8"/><rect x="282" y="150" width="62" height="40" fill="#1d4f7a" stroke="#8fc3e8"/><path d="M303 150v40M324 150v40" stroke="#8fc3e8"/><rect x="118" y="165" width="164" height="10" fill="#a9b9c6"/>
     <ellipse cx="200" cy="170" rx="74" ry="28" fill="none" stroke="#eef3f6" stroke-width="13"/><ellipse cx="200" cy="170" rx="74" ry="28" fill="none" stroke="#7f93a3" stroke-width="2"/><rect x="186" y="110" width="28" height="120" rx="11" fill="#eef3f6"/><circle cx="200" cy="170" r="21" fill="#dfe8ee" stroke="#7f93a3" stroke-width="2"/><circle cx="200" cy="170" r="9" fill="#ff7373" class="led"/><circle cx="200" cy="128" r="4" fill="#0a6ea3"/><circle cx="200" cy="212" r="4" fill="#0a6ea3"/></g></g></svg></div>
     <svg class="pilot" viewBox="0 0 260 400" id="pilot">${ASTRO()}</svg></div></div></div>`;
  addView($('#bigport'),{n:90,speed:.07,size:2,bg:'#020812',planets:true,first:1.5});
  const go=$('#go'),ctrl=$('#ctrl'),pilot=$('#pilot .astro');
  let talkT=null;
  const show=()=>{const t=SPEECH[k];$('#pg').textContent=(k+1)+' / '+SPEECH.length;say(k);
    const dur=voiceOn?VOICE_DUR[k]*1000:t.length*15+200;
    pilot.classList.add('talk');clearTimeout(talkT);talkT=setTimeout(()=>pilot.classList.remove('talk'),dur);
    if(voiceOn)typeSynced($('#say'),t,dur);else typeInto($('#say'),t,'i'+k);
    if(k===SPEECH.length-1){go.hidden=false;$('#next').hidden=true;$('#skip').hidden=true;}};
  $('#next').onclick=()=>{if(k<SPEECH.length-1){k++;show();}};
  $('#skip').onclick=()=>{k=SPEECH.length-1;show();};
  $('#voice').onclick=()=>{voiceOn=!voiceOn;$('#voice').textContent=voiceOn?'Couper sa voix':'Écouter sa voix';$('#voice').setAttribute('aria-pressed',voiceOn);if(voiceOn)show();else{shutUp();clearInterval(typeT);$('#say').textContent=SPEECH[k];pilot.classList.remove('talk');}};
  show();
  $('#f').onsubmit=e=>{e.preventDefault();shutUp();audioStart();S.team=$('#team').value.trim();const first=S.elapsed===0&&S.room===0;S.screen='room';save();render();if(first)door(-1);};
  if($('#rs'))$('#rs').onclick=()=>{S=fresh();busy={};BAY.cut1=false;BAY.cut2=null;BAY.flow=0;save();render();};
}
function report(){
  const t=fmt(S.elapsed);
  return `MISSION ESSAIM : RAPPORT\nÉquipage : ${S.team||'non renseigné'}\nDurée : ${t}\nIndices : ${S.hints}\nErreurs : ${S.errors}\n\n`+QS.map((q,i)=>`Question ${i+1} : ${q.t}\nRéponse : ${S.answers[q.id]||''}`).join('\n\n');
}
function renderEnd(app){
  delete document.documentElement.dataset.room;
  const rem=TOTAL-S.elapsed;
  app.innerHTML=`<div class="screen"><div class="end"><h1>${rem>=0?'Station sauvée':'Station sauvée, de justesse'}</h1>
   <p style="font-size:17px;max-width:65ch">${esc(S.team||'L\'équipage')} a remis Essaim-4 en route grâce au réseau pair-à-pair. ${rem>=0?'Tout le monde est sain et sauf.':'Il a fallu entamer la réserve de secours.'}</p>
   <div class="stats"><div><b>${fmt(S.elapsed)}</b>durée</div><div><b>${S.hints}</b>indices</div><div><b>${S.errors}</b>erreurs</div></div>
   <label for="rep">${FORM_URL?'Votre rapport : copiez-le, puis collez-le dans le formulaire.':'Votre rapport, à copier et à rendre à votre enseignant :'}</label><textarea id="rep" readonly></textarea>
   <div class="row"><button class="pri" id="copy">Copier le rapport</button>${FORM_URL?`<a class="pri formlink" href="${FORM_URL}" target="_blank" rel="noopener">Envoyer à mon enseignant</a>`:''}<button class="sec" id="again">Nouvelle partie</button><span class="msg good" id="cm" role="status"></span></div></div></div>`;
  $('#rep').value=report();
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('#cm').textContent='Rapport copié.';}catch(e){$('#rep').focus();$('#rep').select();$('#cm').textContent='Sélection faite : appuyez sur Ctrl+C.';}};
  $('#again').onclick=()=>{S=fresh();busy={};BAY.cut1=false;BAY.cut2=null;BAY.flow=0;save();render();};
}
const LEX=[['Cerveau central','dans le jeu, la machine centrale de la station'],['Quarantaine','salle où l\'on isole ce qui est suspect le temps de le contrôler'],['Client','ordinateur qui demande quelque chose'],['Serveur','ordinateur qui répond à la demande'],['Requête','demande envoyée à un autre ordinateur'],['Pair-à-pair (P2P)','réseau où chaque ordinateur demande et répond'],['Protocole','règles communes pour échanger des données'],['Paquet','petit morceau d\'un fichier envoyé sur le réseau'],['Adresse IP','adresse d\'un ordinateur sur Internet'],['BitTorrent','protocole pour télécharger un fichier depuis plusieurs ordinateurs'],['Streaming','regarder une vidéo en ligne sans garder le fichier'],['Œuvre','film, musique, jeu vidéo ou livre créé par un auteur'],['Contrefaçon','copie ou partage interdit d\'une œuvre'],['Arcom','Autorité de régulation de la communication audiovisuelle et numérique : organisme public français qui contrôle la télévision, la radio et les contenus en ligne, et protège notamment les droits des créateurs']];
function lexique(){const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal"><h2>Lexique</h2><div class="lex">${LEX.map(([a,b])=>`<b>${a}</b><span>${b}</span>`).join('')}</div><button class="pri" id="lexx" style="justify-self:start">Fermer</button></div>`;
  document.body.append(o);$('#lexx',o).focus();$('#lexx',o).onclick=()=>o.remove();}
function teacherGate(){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<form class="modal" style="max-width:420px"><h2>Espace enseignant</h2><label for="tc">Code enseignant</label><input id="tc" autocomplete="off"><div class="msg bad" id="te"></div><div class="row"><button class="pri">Ouvrir</button><button class="sec" type="button" id="tx">Fermer</button></div></form>`;
  document.body.append(o);$('#tc',o).focus();
  $('#tx',o).onclick=()=>o.remove();
  $('form',o).onsubmit=e=>{e.preventDefault();if($('#tc',o).value.trim().toUpperCase()===TEACHER){o.remove();teacher();}else $('#te',o).textContent='Code incorrect.';};
}
function teacher(){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal"><h2>Fiche enseignant</h2>
  <p><b>Programme :</b> SNT, thème Internet : décrire l'intérêt des réseaux pair-à-pair ainsi que les usages illicites qu'on peut en faire.</p>
  <table><tr><th>Étape</th><th>Temps</th><th>Solutions</th></tr>
  <tr><td>Accueil</td><td>2 min</td><td>Scénario et consignes</td></tr>
  <tr><td>Baie réseau</td><td>5 min</td><td>3 expériences guidées, code 052. Réponses : le Cerveau seul répondait ; échange direct ; client et serveur.</td></tr>
  <tr><td>Soute</td><td>6 min</td><td>8 morceaux, SERRE tombe après le 3ᵉ. Calcul : 400 − 100 = 300. Ordre : IP, morceaux, relais, rassemblement.</td></tr>
  <tr><td>Serre</td><td>5 min</td><td>Ajouter 40 passagers : le serveur en sert 20, les pairs les 40. Réponse : chacun relaie. Vraies : les 4 premières phrases.</td></tr>
  <tr><td>Quarantaine</td><td>5 min</td><td>Illicites : film récent, album, jeu. Clé 3 : DROIT D'AUTEUR. Contrôle : 3ᵉ réponse.</td></tr>
  <tr><td>Passerelle</td><td>7 min</td><td>Assembler 3 phrases justes par question, plus un avis libre, puis mot PAIR.</td></tr></table>
  <p><b>Récit :</b> le Cerveau central et les programmes hostiles sont fictifs ; la panne causée par le piratage sert à introduire le Doc 4. Une fuite retire 1 minute à l'entrée de la Serre, une seule fois. Le son démarre à l'embarquement et se coupe en haut à droite.</p><p><b>Correction des réponses :</b> automatique, sans connexion, par blocs de phrases. Les élèves reconnaissent les bonnes réponses, mais ne les rédigent pas. L'avis final n'est pas noté</p>
  <p><b>À vérifier :</b> les textes reformulent les Docs 1, 2, 3, 3 bis et 4 fournis. Les chiffres du graphique du Doc 4 ne sont pas repris. Le point juridique d'avril 2026 s'appuie sur des sources de presse.</p>
  <div class="row"><span>Tester :</span>${ROOMS.map((r,i)=>`<button class="sec" data-go="${i}">${r.name}</button>`).join('')}</div>
  <div class="row"><button class="sec" id="pz">${S.paused?'Reprendre le chrono':'Mettre le chrono en pause'}</button><button class="sec" id="rz">Réinitialiser la partie</button><button class="pri" id="tx">Fermer</button></div></div>`;
  document.body.append(o);
  $('#tx',o).onclick=()=>o.remove();
  $('#pz',o).onclick=()=>{S.paused=!S.paused;save();$('#pz',o).textContent=S.paused?'Reprendre le chrono':'Mettre le chrono en pause';};
  $('#rz',o).onclick=()=>{S=fresh();busy={};BAY.cut1=false;BAY.cut2=null;BAY.flow=0;save();o.remove();render();};
  $$('[data-go]',o).forEach(b=>b.onclick=()=>{const i=+b.dataset.go;for(let k=0;k<i;k++)S.done[k]=true;S.room=i;S.screen='room';save();o.remove();render();});
}
render();
const profHash=()=>{if(location.hash==='#prof'&&!$('.overlay'))teacherGate();};
addEventListener('hashchange',profHash);profHash();
</script>
